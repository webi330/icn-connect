; GitHub Actions 용 설정입니다. 인증키는 여기에 쓰지 않습니다.
; (GitHub 저장소의 Secrets 에 ICN_SERVICE_KEY 로 저장하면 자동으로 사용됩니다.)

[api]
service_key =
base_url = https://apis.data.go.kr/B551177/statusOfPaxFltDeOdpT2
arrivals_op = getPaxFltArrivalsDeOdpT2
departures_op = getPaxFltDeparturesDeOdpT2
rows_per_page = 1000
timeout_sec = 20
searchdt_code = E
; 제2터미널 여객기 전용 API 라서 여객/화물 구분 값은 쓰지 않습니다. (비워 둠)
passenger_or_cargo =

[filter]
terminal_values =
days_back = 1
days_ahead = 1
arrived_remarks = 도착,착륙
departed_remarks = 출발

[limits]
; 이 API(제2터미널 여객기)의 하루 호출 한도는 1000회입니다. 여유를 두고 900으로 둡니다.
daily_call_limit = 900
neighbor_refresh_min = 60

[schedule]
interval_min = 5
timezone = Asia/Seoul

[output]
data_js_path = site/data.js
