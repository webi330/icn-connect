; GitHub Actions 용 설정입니다. 인증키는 여기에 쓰지 않습니다.
; (GitHub 저장소의 Secrets 에 ICN_SERVICE_KEY 로 저장하면 자동으로 사용됩니다.)

[api]
service_key =
base_url = https://apis.data.go.kr/B551177/statusOfAllFltDeOdp
arrivals_op = getFltArrivalsDeOdp
departures_op = getFltDeparturesDeOdp
rows_per_page = 1000
timeout_sec = 20
searchdt_code = E

[filter]
terminal_values = P03,T2
days_back = 1
days_ahead = 1
arrived_remarks = 도착,착륙
departed_remarks = 출발

[limits]
; 개발계정(하루 500회)이면 450, 운영계정이면 90000
daily_call_limit = 450
neighbor_refresh_min = 60

[schedule]
interval_min = 10
timezone = Asia/Seoul

[output]
data_js_path = site/data.js
