name: ICN CONNECT 데이터 갱신

on:
  schedule:
    # 보조(백업) 스케줄입니다. GitHub 스케줄은 자주 지연/누락되므로 15분 간격으로 두고,
    # 5분 주기는 외부 트리거(cron-job.org 등 → workflow_dispatch)가 담당합니다.
    - cron: "7-59/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 방식 (sync: 정식 / probe: API 응답 필드 확인 / demo: 샘플 화면)"
        type: choice
        options: [sync, probe, demo]
        default: sync

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: icn-connect
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODE: ${{ github.event.inputs.mode || 'sync' }}
      TZ: Asia/Seoul
    environment:
      name: github-pages
      url: ${{ steps.deploy3.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 이전 데이터 상태 가져오기
        run: |
          mkdir -p site
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          curl -fsSL --retry 3 --retry-delay 3 --retry-all-errors "$BASE/sync_state.json?t=$(date +%s)" -o site/sync_state.json || echo "이전 상태가 없습니다 (첫 실행이면 정상)."
          curl -fsSL --retry 3 --retry-delay 3 --retry-all-errors "$BASE/data.js?t=$(date +%s)" -o prev_data.js || echo "이전 data.js 가 없습니다 (첫 실행이면 정상)."

      - name: 화면 파일 복사
        run: |
          cp index.html site/index.html
          if [ -f supabase-config.js ]; then cp supabase-config.js site/supabase-config.js; fi

      - name: 데이터 갱신 실행
        env:
          ICN_SERVICE_KEY: ${{ secrets.ICN_SERVICE_KEY }}
          ICN_DATA_JS_PATH: site/data.js
          ICN_STATE_PATH: site/sync_state.json
        run: |
          case "$MODE" in
            probe) ARG="--probe"; TITLE="API 응답 확인 결과" ;;
            demo)  ARG="--demo";  TITLE="샘플 데이터 생성 결과" ;;
            *)     ARG="";        TITLE="데이터 갱신 결과" ;;
          esac
          rc=0
          python icn_gate_sync.py --config config.github.ini $ARG > run_out.txt 2>&1 || rc=$?
          cat run_out.txt
          { echo "## $TITLE"; echo '```'; cat run_out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # 항공편 내용이 이전과 같고 마지막 게시가 10분 이내면 배포를 건너뜁니다.
      # (화면은 15분 넘게 갱신이 없으면 'Update delayed'를 표시하므로 10분마다는 반드시 게시합니다.)
      - name: 변경 여부 확인
        id: changed
        if: env.MODE == 'sync'
        run: |
          python - <<'PY'
          import json, os, re
          from datetime import datetime

          def load(path):
              try:
                  t = open(path, encoding="utf-8").read()
                  return json.loads(t[t.index("{"):t.rindex("}") + 1])
              except Exception:
                  return None

          new, old = load("site/data.js"), load("prev_data.js")
          skip = False
          if new and old:
              same = new.get("flights") == old.get("flights") and new.get("range") == old.get("range")
              try:
                  age = (datetime.now() - datetime.strptime(old["generatedAt"], "%Y-%m-%dT%H:%M")).total_seconds() / 60
              except Exception:
                  age = 999
              skip = same and age < 10
              print("내용 동일: %s / 마지막 게시 후 %.1f분 → 게시 %s" % (same, age, "건너뜀" if skip else "진행"))
          else:
              print("이전 데이터를 비교할 수 없어 게시를 진행합니다.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("skip=%s\n" % str(skip).lower())
          PY

      - name: 페이지 파일 묶기
        if: env.MODE != 'probe' && steps.changed.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # --- 게시: GitHub Pages 일시 장애(502 등)에 대비해 최대 3회 시도 ---
      - name: 페이지 게시 (1차)
        id: deploy1
        if: env.MODE != 'probe' && steps.changed.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: 30초 후 재시도 대기
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      - name: 페이지 게시 (2차)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: 60초 후 재시도 대기
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60

      - name: 페이지 게시 (3차)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
